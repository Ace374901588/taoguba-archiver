name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m ruff check .
      - run: taoguba-archiver --help
      - run: taoguba-archiver-gui --smoke-test
      - run: taoguba-archiver-gui --browser-smoke-test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[build]"
      - run: python scripts/build_app.py --clean
      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\TaogubaArchiver\TaogubaArchiver.exe').Path
          $ui = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($ui.ExitCode -ne 0) { exit $ui.ExitCode }
          $browser = Start-Process -FilePath $exe -ArgumentList '--browser-smoke-test' -Wait -PassThru
          if ($browser.ExitCode -ne 0) { exit $browser.ExitCode }
      - name: Smoke-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/TaogubaArchiver.app/Contents/MacOS/TaogubaArchiver --smoke-test
          dist/TaogubaArchiver.app/Contents/MacOS/TaogubaArchiver --browser-smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: TaogubaArchiver-${{ runner.os }}
          path: dist/
          if-no-files-found: error
